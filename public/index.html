<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nearby</title>
<style>
:root{
  --bg:#f4f6f8; --surface:#fff; --ink:#12161c; --muted:#667085; --line:#e3e7ec;
  --accent:#0b8f6f; --accent-ink:#fff; --soft:#e9f5f1; --danger:#d92d20;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1114; --surface:#161a1f; --ink:#e8ecf1; --muted:#8b95a3; --line:#242a31; --accent:#19b88e; --accent-ink:#04120d; --soft:#12231e; --danger:#f97066;}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:currentColor;display:block}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--soft);color:var(--accent)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

.app{display:grid;grid-template-columns:272px 1fr;height:100%;height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:20px 20px 12px;font-size:20px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
.dot.on{background:var(--accent)}
.side h2{font-size:13px;font-weight:600;color:var(--muted);padding:8px 20px}
.peers{flex:1;overflow:auto;padding:0 8px}
.peer{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px}
.peer:hover{background:var(--bg)}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:15px}
.peer .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:12px 20px;color:var(--muted);font-size:14px}
.me{border-top:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:14px}
.me .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{color:var(--accent);font-size:13px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:none;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .t{flex:1;font-weight:600}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:6px;min-height:0}
.hint{margin:auto;text-align:center;color:var(--muted);max-width:320px}
.msg{max-width:min(75%,560px);align-self:flex-start}
.msg.mine{align-self:flex-end}
.who{font-size:12px;color:var(--muted);margin:6px 12px 2px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-radius:16px 16px 4px 16px}
.time{font-size:11px;color:var(--muted);margin:2px 12px}
.mine .time{text-align:right}
.file{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;white-space:normal}
.file .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.mine .file .ic{background:rgba(255,255,255,.2);color:inherit}
.file .nm{font-weight:600;overflow-wrap:anywhere}
.file .sz{font-size:12px;opacity:.75}
.bubble img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:8px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px;min-width:180px}
.bar i{display:block;height:100%;width:0;background:var(--accent)}

.composer{display:flex;align-items:flex-end;gap:4px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:9px 15px;font:inherit;max-height:140px;min-height:40px}
.send{background:var(--accent);color:var(--accent-ink)}
.send:hover{background:var(--accent);color:var(--accent-ink);filter:brightness(1.08)}
.drop{position:absolute;inset:0;background:color-mix(in srgb,var(--accent) 12%,transparent);border:2px dashed var(--accent);display:none;place-items:center;font-weight:600;color:var(--accent);z-index:5;pointer-events:none}
.drop.show{display:grid}

.join{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:30;padding:20px}
.join form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.join h1{font-size:28px;letter-spacing:-.03em}
.join p{color:var(--muted)}
.join input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.join button{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px;font-weight:600}
.warn{background:var(--soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;display:none}

.incoming{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:25;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);width:min(92vw,360px)}
.incoming.show{display:flex}
.incoming .tx{flex:1;min-width:0}
.incoming .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.incoming .tx span{font-size:13px;color:var(--muted)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.round.ok{background:var(--accent);color:var(--accent-ink)}
.round.no{background:var(--danger)}

.call{position:fixed;inset:0;background:#080a0c;z-index:20;display:none;color:#fff}
.call.show{display:block}
#remote{width:100%;height:100%;object-fit:cover;background:#080a0c}
.call .who-big{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;pointer-events:none}
.call .who-big .avatar{width:112px;height:112px;font-size:44px}
.call .info{position:absolute;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 20px 40px;background:linear-gradient(#000a,transparent);text-align:center}
.call .info b{display:block;font-size:17px}
.call .info span{font-size:13px;opacity:.8}
#local{position:absolute;right:16px;bottom:120px;width:110px;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#222;transform:scaleX(-1);border:1px solid #fff3;display:none}
.controls{position:absolute;left:0;right:0;bottom:0;padding:24px 0 calc(28px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:18px;background:linear-gradient(transparent,#000a)}
.controls .round{width:54px;height:54px;background:#ffffff26;backdrop-filter:blur(6px)}
.controls .round.off{background:#fff;color:#111}
.controls .round.end{background:var(--danger)}
.controls .round.end svg{transform:rotate(135deg)}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.scrim{display:none}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .top{display:flex}
  .side{position:fixed;inset:0 auto 0 0;width:min(84vw,320px);z-index:15;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .scrim.show{display:block;position:fixed;inset:0;background:#0006;z-index:14}
  .msg{max-width:88%}
  .msgs{padding:14px 12px}
  #local{width:88px;bottom:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="join" id="join">
  <form id="joinForm">
    <h1>Nearby</h1>
    <p>Chat, share files and call people on this Wi-Fi. Pick a name to join.</p>
    <input id="nameInput" maxlength="24" placeholder="Your name" autocomplete="nickname" required>
    <div class="warn" id="secureWarn">Calls need a secure connection. Open this page with https:// to use voice and video.</div>
    <button type="submit">Join</button>
  </form>
</div>

<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="dot" id="dot"></span>Nearby</div>
    <h2 id="peerHead">On this network</h2>
    <div class="peers" id="peers"></div>
    <div class="me"><div class="avatar" id="meAv"></div><span class="n" id="meName"></span><button class="link" id="rename">Change name</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div class="top">
      <button class="icon-btn" id="menu" aria-label="People"><svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 100-6 3 3 0 000 6zM8 11a3 3 0 100-6 3 3 0 000 6zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500z"/></svg></button>
      <div class="t">Everyone</div>
      <span class="dot" id="dot2"></span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="drop" id="drop">Drop files to send</div>
    <div class="composer">
      <button class="icon-btn" id="attach" aria-label="Send a file"><svg viewBox="0 0 24 24"><path d="M16.5 6v11.500a4 4 0 01-8 0V5a2.500 2.500 0 015 0v10.500a1 1 0 01-2 0V6H10v9.500a2.500 2.500 0 005 0V5a4 4 0 00-8 0v12.500a5.500 5.500 0 0011 0V6z"/></svg></button>
      <input type="file" id="filePick" multiple hidden>
      <textarea id="text" rows="1" placeholder="Message everyone" aria-label="Message"></textarea>
      <button class="icon-btn send" id="sendBtn" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M3 20.500v-6.500l9-2-9-2V3.500L22 12z"/></svg></button>
    </div>
  </main>
</div>

<div class="incoming" id="incoming">
  <div class="avatar" id="inAv"></div>
  <div class="tx"><b id="inName"></b><span id="inKind"></span></div>
  <button class="round no" id="decline" aria-label="Decline"><svg viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M6.600 10.800a15 15 0 006.600 6.600l2.200-2.200a1 1 0 011-.25 11 11 0 003.500.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.500a1 1 0 011 1c0 1.200.2 2.400.56 3.500a1 1 0 01-.25 1z"/></svg></button>
  <button class="round ok" id="accept" aria-label="Accept"><svg viewBox="0 0 24 24"><path d="M6.600 10.800a15 15 0 006.600 6.600l2.200-2.200a1 1 0 011-.25 11 11 0 003.500.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.500a1 1 0 011 1c0 1.200.2 2.400.56 3.500a1 1 0 01-.25 1z"/></svg></button>
</div>

<div class="call" id="call">
  <video id="remote" autoplay playsinline></video>
  <div class="who-big" id="whoBig"><div class="avatar" id="callAv"></div></div>
  <div class="info"><b id="callName"></b><span id="callStatus"></span></div>
  <video id="local" autoplay playsinline muted></video>
  <div class="controls">
    <button class="round" id="mic" aria-label="Mute microphone"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.900V21h2v-3.100A7 7 0 0019 11z"/></svg></button>
    <button class="round" id="cam" aria-label="Turn camera off"><svg viewBox="0 0 24 24"><path d="M15 8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-2.500l5 3.500V7l-5 3.500z"/></svg></button>
    <button class="round end" id="hang" aria-label="End call"><svg viewBox="0 0 24 24"><path d="M6.600 10.800a15 15 0 006.600 6.600l2.200-2.200a1 1 0 011-.25 11 11 0 003.500.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.500a1 1 0 011 1c0 1.200.2 2.400.56 3.500a1 1 0 01-.25 1z"/></svg></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const ICON = {
  phone: '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 006.6 6.6l2.2-2.2a1 1 0 011-.25 11 11 0 003.5.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.2.2 2.4.56 3.5a1 1 0 01-.25 1z"/></svg>',
  video: '<svg viewBox="0 0 24 24"><path d="M15 8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-2.5l5 3.5V7l-5 3.5z"/></svg>',
  file: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8zm-1 7V3.500L18.500 9z"/></svg>',
};
const COLORS = ['#0b8f6f', '#3b6fe0', '#c2410c', '#7c3aed', '#be185d', '#0e7490', '#4d7c0f', '#b45309'];
const colorFor = (id) => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const initial = (n) => (n.trim()[0] || '?').toUpperCase();
function avatar(el, id, name) { el.textContent = initial(name); el.style.background = colorFor(id); }

let name = localStorage.getItem('nearby-name') || '';
let ws, me = null;
const peers = new Map();

// ---------- toast ----------
let toastT;
function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3000);
}

// ---------- join ----------
const secure = window.isSecureContext && !!navigator.mediaDevices;
if (!secure) $('#secureWarn').style.display = 'block';
$('#nameInput').value = name;
$('#joinForm').onsubmit = (e) => {
  e.preventDefault();
  const v = $('#nameInput').value.trim();
  if (!v) return;
  const changed = v !== name;
  name = v; localStorage.setItem('nearby-name', name);
  $('#join').style.display = 'none';
  if (!ws) connect(); else if (changed && ws.readyState === 1) ws.close();
};
if (name) { $('#join').style.display = 'none'; }
$('#rename').onclick = () => { $('#join').style.display = 'grid'; $('#nameInput').focus(); };

// ---------- websocket ----------
function setStatus(on) { $('#dot').classList.toggle('on', on); $('#dot2').classList.toggle('on', on); }
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => { setStatus(true); ws.send(JSON.stringify({ type: 'join', name })); };
  ws.onmessage = (e) => handle(JSON.parse(e.data));
  ws.onclose = () => {
    setStatus(false);
    if (callWith) endCall(false);
    if (incoming) { incoming = null; $('#incoming').classList.remove('show'); }
    setTimeout(connect, 1500);
  };
}
const sendWS = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const signal = (to, data) => sendWS({ type: 'signal', to, data });

function handle(m) {
  switch (m.type) {
    case 'welcome':
      me = m.id;
      peers.clear(); m.peers.forEach((p) => p.id !== me && peers.set(p.id, p));
      avatar($('#meAv'), me, name); $('#meName').textContent = name + ' (you)';
      $('#msgs').innerHTML = '';
      if (!m.history.length) showHint();
      m.history.forEach(addMsg);
      renderPeers();
      break;
    case 'peer-joined': peers.set(m.peer.id, m.peer); renderPeers(); break;
    case 'peer-left':
      peers.delete(m.id); renderPeers();
      if (callWith === m.id) { toast('Call ended'); endCall(false); }
      if (incoming && incoming.from === m.id) { incoming = null; $('#incoming').classList.remove('show'); }
      break;
    case 'chat': case 'file': addMsg(m); break;
    case 'signal': onSignal(m.from, m.data); break;
  }
}

// ---------- people ----------
function renderPeers() {
  const box = $('#peers'); box.innerHTML = '';
  $('#peerHead').textContent = peers.size ? `On this network (${peers.size})` : 'On this network';
  if (!peers.size) {
    box.innerHTML = '<div class="empty">No one else is here yet. Open this address on another device on the same Wi-Fi.</div>';
    return;
  }
  peers.forEach((p) => {
    const row = document.createElement('div'); row.className = 'peer';
    const av = document.createElement('div'); av.className = 'avatar'; avatar(av, p.id, p.name);
    const n = document.createElement('span'); n.className = 'n'; n.textContent = p.name;
    const a = document.createElement('button'); a.className = 'icon-btn'; a.innerHTML = ICON.phone; a.title = 'Voice call'; a.setAttribute('aria-label', 'Voice call ' + p.name);
    const v = document.createElement('button'); v.className = 'icon-btn'; v.innerHTML = ICON.video; v.title = 'Video call'; v.setAttribute('aria-label', 'Video call ' + p.name);
    a.onclick = () => { closeSide(); startCall(p.id, false); };
    v.onclick = () => { closeSide(); startCall(p.id, true); };
    row.append(av, n, a, v); box.append(row);
  });
}
const closeSide = () => { $('#side').classList.remove('open'); $('#scrim').classList.remove('show'); };
$('#menu').onclick = () => { $('#side').classList.add('open'); $('#scrim').classList.add('show'); };
$('#scrim').onclick = closeSide;

// ---------- messages ----------
const msgs = $('#msgs');
function showHint() {
  msgs.innerHTML = '<div class="hint" id="hint">Messages and files you send here go to everyone on this network.</div>';
}
const fmtTime = (ts) => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}
function addMsg(m) {
  const hint = $('#hint'); if (hint) hint.remove();
  const mine = m.from === me;
  const wrap = document.createElement('div'); wrap.className = 'msg' + (mine ? ' mine' : '');
  if (!mine) { const w = document.createElement('div'); w.className = 'who'; w.textContent = m.name; wrap.append(w); }
  const b = document.createElement('div'); b.className = 'bubble';
  if (m.type === 'chat') b.textContent = m.text;
  else {
    const f = m.file, url = '/files/' + f.id;
    if (/^image\/(png|jpeg|gif|webp)$/.test(f.mime)) {
      const img = document.createElement('img'); img.src = url; img.alt = f.name; img.loading = 'lazy';
      img.onload = () => (msgs.scrollTop = msgs.scrollHeight);
      b.append(img);
    }
    const a = document.createElement('a'); a.className = 'file'; a.href = url; a.download = f.name;
    const ic = document.createElement('div'); ic.className = 'ic'; ic.innerHTML = ICON.file;
    const t = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = f.name;
    const sz = document.createElement('div'); sz.className = 'sz'; sz.textContent = fmtSize(f.size) + ' · Tap to download';
    t.append(nm, sz); a.append(ic, t); b.append(a);
  }
  const tm = document.createElement('div'); tm.className = 'time'; tm.textContent = fmtTime(m.ts);
  wrap.append(b, tm); msgs.append(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

// ---------- composer ----------
const ta = $('#text');
function sendText() {
  const t = ta.value.trim(); if (!t) return;
  sendWS({ type: 'chat', text: t });
  ta.value = ''; ta.style.height = 'auto'; ta.focus();
}
$('#sendBtn').onclick = sendText;
ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); } };
ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; };
$('#attach').onclick = () => $('#filePick').click();
$('#filePick').onchange = (e) => { [...e.target.files].forEach(upload); e.target.value = ''; };

function upload(file) {
  if (!me) return toast('Not connected yet');
  const hint = $('#hint'); if (hint) hint.remove();
  const wrap = document.createElement('div'); wrap.className = 'msg mine';
  const b = document.createElement('div'); b.className = 'bubble';
  const label = document.createElement('div'); label.textContent = 'Sending ' + file.name;
  const bar = document.createElement('div'); bar.className = 'bar'; const fill = document.createElement('i'); bar.append(fill);
  b.append(label, bar); wrap.append(b); msgs.append(wrap); msgs.scrollTop = msgs.scrollHeight;
  const x = new XMLHttpRequest();
  x.open('POST', `/upload?cid=${me}&name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(file.type || '')}`);
  x.upload.onprogress = (e) => { if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%'; };
  x.onload = () => { wrap.remove(); if (x.status !== 200) toast(x.status === 413 ? 'File is too large (2 GB max)' : 'Upload failed'); };
  x.onerror = () => { wrap.remove(); toast('Upload failed. Check your connection.'); };
  x.send(file);
}
// drag & drop, paste
let dragDepth = 0;
const main = $('#main');
main.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; $('#drop').classList.add('show'); });
main.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('show'); } });
main.addEventListener('dragover', (e) => e.preventDefault());
main.addEventListener('drop', (e) => {
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('show');
  [...e.dataTransfer.files].forEach(upload);
});
document.addEventListener('paste', (e) => {
  const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); fs.forEach(upload); }
});

// ---------- calls (WebRTC, peer to peer) ----------
let pc = null, stream = null, callWith = null, incoming = null, queued = [], timer = null, ringTO = null;
const remote = $('#remote'), local = $('#local');

async function getMedia(video) {
  try { return await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { facingMode: 'user' } : false }); }
  catch (e) {
    if (video) { try { return await navigator.mediaDevices.getUserMedia({ audio: true }); } catch {} }
    return null;
  }
}
function makePC(peerId) {
  pc = new RTCPeerConnection({ iceServers: [] }); // same network: no STUN/TURN needed
  queued = [];
  pc.onicecandidate = (e) => e.candidate && signal(peerId, { kind: 'candidate', candidate: e.candidate });
  pc.ontrack = (e) => {
    remote.srcObject = e.streams[0];
    $('#whoBig').style.display = e.streams[0].getVideoTracks().length ? 'none' : 'grid';
  };
  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') { clearTimeout(ringTO); startTimer(); }
    if (pc.connectionState === 'failed') { toast('Call failed'); endCall(false); }
  };
}
function openCall(peerId, status) {
  const p = peers.get(peerId) || { name: 'Unknown' };
  $('#callName').textContent = p.name; avatar($('#callAv'), peerId, p.name);
  $('#callStatus').textContent = status;
  $('#whoBig').style.display = 'grid';
  local.srcObject = stream;
  const hasVideo = stream.getVideoTracks().length > 0;
  local.style.display = hasVideo ? 'block' : 'none';
  $('#cam').style.display = hasVideo ? 'grid' : 'none';
  $('#mic').classList.remove('off'); $('#cam').classList.remove('off');
  $('#call').classList.add('show');
}
function startTimer() {
  const t0 = Date.now(); clearInterval(timer);
  const tick = () => { const s = Math.floor((Date.now() - t0) / 1000); $('#callStatus').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  tick(); timer = setInterval(tick, 1000);
}
async function startCall(id, video) {
  if (callWith || incoming) return toast('Finish your current call first');
  if (!secure) return toast('Calls need https://. Open the https address of this server.');
  callWith = id;
  stream = await getMedia(video);
  if (!stream) { callWith = null; return toast('Allow microphone access to make calls'); }
  openCall(id, 'Calling…');
  makePC(id);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  signal(id, { kind: 'offer', sdp: pc.localDescription, video: stream.getVideoTracks().length > 0 });
  ringTO = setTimeout(() => { if (callWith === id && pc && pc.connectionState !== 'connected') { toast('No answer'); endCall(true); } }, 45000);
}
async function onSignal(from, d) {
  if (d.kind === 'offer') {
    if (callWith || incoming) return signal(from, { kind: 'busy' });
    incoming = { from, sdp: d.sdp, video: d.video }; queued = [];
    const p = peers.get(from) || { name: 'Someone' };
    avatar($('#inAv'), from, p.name); $('#inName').textContent = p.name;
    $('#inKind').textContent = d.video ? 'Video call' : 'Voice call';
    $('#incoming').classList.add('show');
  } else if (d.kind === 'answer' && pc && callWith === from) {
    await pc.setRemoteDescription(d.sdp); flushQueue();
    $('#callStatus').textContent = 'Connecting…';
  } else if (d.kind === 'candidate') {
    if (pc && callWith === from && pc.remoteDescription) pc.addIceCandidate(d.candidate).catch(() => {});
    else if (callWith === from || (incoming && incoming.from === from)) queued.push(d.candidate);
  } else if (['hangup', 'busy', 'reject'].includes(d.kind)) {
    if (callWith === from) { toast(d.kind === 'busy' ? 'They are on another call' : d.kind === 'reject' ? 'Call declined' : 'Call ended'); endCall(false); }
    else if (incoming && incoming.from === from) { incoming = null; $('#incoming').classList.remove('show'); }
  }
}
function flushQueue() { queued.forEach((c) => pc.addIceCandidate(c).catch(() => {})); queued = []; }

$('#accept').onclick = async () => {
  if (!incoming) return;
  const { from, sdp, video } = incoming; incoming = null; $('#incoming').classList.remove('show');
  callWith = from;
  stream = await getMedia(video);
  if (!stream) { signal(from, { kind: 'reject' }); callWith = null; return toast(secure ? 'Allow microphone access to answer' : 'Calls need https://'); }
  openCall(from, 'Connecting…');
  makePC(from);
  await pc.setRemoteDescription(sdp);
  stream.getTracks().forEach((t) => pc.addTrack(t, stream));
  flushQueue();
  const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
  signal(from, { kind: 'answer', sdp: pc.localDescription });
};
$('#decline').onclick = () => {
  if (!incoming) return;
  signal(incoming.from, { kind: 'reject' }); incoming = null; $('#incoming').classList.remove('show');
};
function endCall(notify = true) {
  if (notify && callWith) signal(callWith, { kind: 'hangup' });
  clearInterval(timer); clearTimeout(ringTO);
  if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  remote.srcObject = null; local.srcObject = null;
  callWith = null; queued = [];
  $('#call').classList.remove('show');
}
$('#hang').onclick = () => endCall(true);
$('#mic').onclick = (e) => {
  if (!stream) return;
  const t = stream.getAudioTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled);
  e.currentTarget.setAttribute('aria-label', t.enabled ? 'Mute microphone' : 'Unmute microphone');
};
$('#cam').onclick = (e) => {
  if (!stream) return;
  const t = stream.getVideoTracks()[0]; if (!t) return;
  t.enabled = !t.enabled; e.currentTarget.classList.toggle('off', !t.enabled);
  e.currentTarget.setAttribute('aria-label', t.enabled ? 'Turn camera off' : 'Turn camera on');
};
window.addEventListener('beforeunload', () => { if (callWith) signal(callWith, { kind: 'hangup' }); });

if (name) connect();
</script>
